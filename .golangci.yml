version: "2"
linters:
  default: standard
  enable:
    - copyloopvar
    - misspell
    - nolintlint
    - unconvert
    - unparam
  settings:
    errcheck:
      # Checking that deferred Close errors are handled is noise here.
      exclude-functions:
        - (io.Closer).Close
        - (*os.File).Close
formatters:
  enable:
    - gofmt
