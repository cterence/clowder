name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go build ./...
      - run: go vet ./...
      # The suite is loopback-only; no network, no DERP access needed.
      - run: go test -race -count=1 ./...

  cross-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: GOOS=darwin GOARCH=arm64 go build ./...
      - run: GOOS=darwin GOARCH=amd64 go build ./...
      - run: GOOS=windows go build ./...
      - run: GOOS=linux GOARCH=arm64 go build ./...
      # Android too: the on-device toolchain cannot auto-download go
      # >= 1.27.1 (no android build of golang.org/toolchain), so the
      # supported path is cross-compiling — keep it green.
      - run: GOOS=android GOARCH=arm64 go build ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: golangci/golangci-lint-action@v7
        with:
          # Keep in sync with the nix devshell's golangci-lint.
          version: v2.13.2

  # Real-DERP integration: pairing, transfer, storer relay and the full
  # binary against tailcat.dev's public relays. Needs outbound network,
  # which the loopback suite deliberately does not. These are also the
  # transport tests loopback cannot authenticate (PeerKey paths).
  #
  # The runner's datacenter sits ~equidistant from two DERP regions and
  # its netcheck flaps between them, which can break the pairing
  # meeting (see AGENTS.md, pairing hardening). One retry absorbs that
  # hiccup; a second consecutive failure fails the job.
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: daemon suite (retry once on DERP flakiness)
        run: |
          CLOWDER_INTEGRATION=1 go test ./daemon/ -run Integration -count=1 -timeout 10m -v \
            || CLOWDER_INTEGRATION=1 go test ./daemon/ -run Integration -count=1 -timeout 10m -v
      - name: end-to-end suite (retry once on DERP flakiness)
        run: |
          CLOWDER_INTEGRATION=1 go test . -run TestIntegrationEndToEnd -count=1 -timeout 10m -v \
            || CLOWDER_INTEGRATION=1 go test . -run TestIntegrationEndToEnd -count=1 -timeout 10m -v
