name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go build ./...
      - run: go vet ./...
      # The suite is loopback-only; no network, no DERP access needed.
      - run: go test -race -count=1 ./...

  cross-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: GOOS=darwin GOARCH=arm64 go build ./...
      - run: GOOS=darwin GOARCH=amd64 go build ./...
      - run: GOOS=windows go build ./...
      - run: GOOS=linux GOARCH=arm64 go build ./...
      # Android too: the on-device toolchain cannot auto-download go
      # >= 1.27.1 (no android build of golang.org/toolchain), so the
      # supported path is cross-compiling — keep it green. CGO_ENABLED=0
      # is required: android is the one cross target where cgo stays on
      # by default, and glibc headers happen to satisfy runtime/cgo, so
      # the build would silently link glibc instead of bionic.
      - run: CGO_ENABLED=0 GOOS=android GOARCH=arm64 go build ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: golangci/golangci-lint-action@v7
        with:
          # Keep in sync with the nix devshell's golangci-lint.
          version: v2.13.2

  # Real-DERP integration: pairing, transfer, storer relay and the full
  # binary against tailcat.dev's public relays. Needs outbound network,
  # which the loopback suite deliberately does not. These are also the
  # transport tests loopback cannot authenticate (PeerKey paths).
  # No automatic retry: a second suite run right after the first hammers
  # the relays and failed 3/3 where the first run passed 2/3 — re-run
  # the job manually instead.
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: CLOWDER_INTEGRATION=1 go test ./daemon/ -run Integration -count=1 -timeout 10m -v
      - run: CLOWDER_INTEGRATION=1 go test . -run TestIntegrationEndToEnd -count=1 -timeout 10m -v
